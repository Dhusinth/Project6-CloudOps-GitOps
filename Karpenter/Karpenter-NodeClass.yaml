apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: default
  namespace: karpenter

spec:
  amiFamily: AL2023

  role: project6-dev-node-role

  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/project6-dev: shared

  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/project6-dev: owned