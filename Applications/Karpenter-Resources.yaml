apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: karpenter-resources
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Dhusinth/Project6-CloudOps-GitOps.git
    targetRevision: main
    path: Karpenter

  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true