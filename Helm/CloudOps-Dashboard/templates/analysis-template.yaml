apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: cloudops-success-rate

spec:
  metrics:
  - failureLimit: 3
    interval: 30s
    name: success-rate
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(
            rate(cloudops_http_requests_total{status!~"5.."}[1m])
          )
          /
          sum(
            rate(cloudops_http_requests_total[1m])
          )
          OR on() vector(1)
    successCondition: result[0] >= 0.95