apiVersion: v1
kind: Service
metadata:
  name: cloudops-dashboard
  labels:
    app: cloudops-dashboard
spec:
  type: {{ .Values.service.type }}
  selector:
    app: cloudops-dashboard
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP