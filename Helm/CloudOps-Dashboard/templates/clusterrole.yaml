apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: cloudops-dashboard

rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch